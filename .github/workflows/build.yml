name: Build Dragon Addons

on:
  workflow_dispatch:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.project_name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - project_name: Poison Dragons
            project_dir: projects/PoisonDragons-Fabric-1.21.10-rewrite
            artifact_name: poison-dragons-fabric-1.21.10
          - project_name: Sannan's Dragons
            project_dir: projects/SannansDragons-Fabric-1.21.10-rewrite
            artifact_name: sannans-dragons-fabric-1.21.10

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 8.14.3
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Build mod (log is saved to build.log)
        working-directory: ${{ matrix.project_dir }}
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace clean build 2>&1 | tee build.log

      - name: Check JAR contents
        working-directory: ${{ matrix.project_dir }}
        shell: bash
        run: |
          jar=$(ls build/libs/*.jar | grep -v -- '-sources' | head -1)
          echo "JAR: $jar"
          unzip -l "$jar" | grep -E 'fabric.mod.json|\.class$' | head -5
          unzip -p "$jar" fabric.mod.json | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['id'], d['version'], d['depends'])"

      - name: Upload JAR (without sources JAR)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            ${{ matrix.project_dir }}/build/libs/*.jar
            !${{ matrix.project_dir }}/build/libs/*-sources.jar
          if-no-files-found: error
          retention-days: 30

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}-build-log
          path: ${{ matrix.project_dir }}/build.log
          if-no-files-found: ignore
          retention-days: 14
